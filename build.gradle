// ###################################################################
// Maven
// ###################################################################

publishing {
  publications {
    MuspellheimCommonsPublication(MavenPublication) {
      from components.java
 //     artifact sourcesJar
 //     artifact javadocJar
      groupId = 'de.muspellheim'
      artifactId = project.name
//      version = project.version
    }
  }

  repositories {
        maven {
            def releasesRepoUrl = "http://bitctrlbuildserver:8081/nexus/repository/releases/"
            def snapshotsRepoUrl = "http://bitctrlbuildserver:8081/nexus/repository/snapshots/"
            url = version.endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl
            allowInsecureProtocol = true
        }
    }

}
